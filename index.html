<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Maurya Digital Library (MDL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--navy:#0b1f4d;--blue:#1f4fd8;--lb:#e8f0ff;--gold:#f5b800;--bg:#f2f6ff;--card:#fff;--tx:#0f1b3a;--mu:#5b6785;--bd:#dfe6f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1330;--card:#122049;--tx:#eaf0ff;--mu:#9fb0d8;--bd:#233266;--lb:#182a5c}}
:root[data-theme=dark]{--bg:#0a1330;--card:#122049;--tx:#eaf0ff;--mu:#9fb0d8;--bd:#233266;--lb:#182a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(90deg,var(--navy),#16399a);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 4px 18px #0b1f4d44}
header img{width:44px;height:44px;border-radius:50%;background:#fff}header b{font-size:15px;letter-spacing:.5px;flex:1}header small{display:block;color:var(--gold);font-weight:500;font-size:11px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#dbe5ff;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:99px}nav a:hover,nav a.on{background:#ffffff22;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 8px 28px #1f4fd814;margin-bottom:16px}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;text-align:center;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:#f5b80030;filter:blur(30px)}
.hero img{width:130px;height:130px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 4px #f5b80088}
.hero h1{margin:10px 0 2px;font-size:24px;letter-spacing:1px}.hero .t{color:var(--gold);font-style:italic}
.glass{background:#ffffff1f;border:1px solid #ffffff44;backdrop-filter:blur(8px);border-radius:14px;padding:10px;margin:14px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font:600 16px inherit;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #1f4fd855}.btn.g{background:linear-gradient(90deg,#f5b800,#ffd54a);color:#0b1f4d}.btn.o{background:var(--lb);color:var(--blue)}.btn.big{width:100%;padding:17px;font-size:19px}.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}.btn.r{background:#d93a3a}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.grid .btn{width:100%}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--blue)}textarea{min-height:130px}
input[type=checkbox]{width:auto}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.stat{text-align:center;padding:14px}.stat b{display:block;font-size:28px;color:var(--blue)}.stat span{font-size:12px;color:var(--mu)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px;text-transform:uppercase}tr.c{cursor:pointer}tr.c:hover{background:var(--lb)}
.b{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--lb);color:var(--blue);white-space:nowrap}.b.New{background:#fff3c4;color:#8a6200}.b.Resolved{background:#d8f6e3;color:#14773b}.b.Rejected{background:#eee;color:#666}.b.Urgent{background:#ffdede;color:#c02626}.b.Pending{background:#ffe7d1;color:#b35a00}
.msg{padding:12px;border-radius:12px;background:#ffdede;color:#8f1d1d;margin:10px 0}.ok{background:#d8f6e3;color:#14773b}.info{background:var(--lb);color:var(--navy)}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--gold))}.center{text-align:center}.mu{color:var(--mu);font-size:14px}h2{margin:4px 0 12px}
.photo{max-width:100%;border-radius:14px;max-height:320px}.qr{display:inline-block;padding:14px;background:#fff;border-radius:18px;border:3px solid var(--gold)}.qr img{display:none!important}.qr canvas{width:min(260px,70vw)!important;height:auto!important}
</style>

function photo(f){return new Promise((ok,no)=>{if(!f)return ok('');if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>6e6)return no('सिर्फ JPG/PNG/WEBP photo (max 6MB) allowed है.');const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};i.onerror=()=>no('Photo पढ़ी नहीं जा सकी.');i.src=u})}
